[package]
name = "dbv-unreal-ai"
version = "0.1.0"
description = "DBV Unreal AI — copiloto de IA nativo para Unreal Engine 5.8"
authors = ["David Bueno Vallejo", "David Bueno Carmona"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dbv_unreal_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# IA integrada y OPCIONAL (docs/IA.md): solo escritorio. En móvil no hay `keyring` ni procesos hijos
# para los agentes ACP, y `src/ai/` no se usa.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Claves de API en el almacén del SO (Credential Manager / Keychain / Secret Service).
keyring = "4"
# Cliente HTTP bloqueante para los modelos locales y de nube.
ureq = { version = "3", features = ["json"] }
# Solo el canal `oneshot` y los temporizadores de la sesión ACP; sin runtime propio.
tokio = { version = "1", features = ["sync", "time"] }
# Listar y buscar ficheros de la carpeta de trabajo y la foto de restauración de los agentes.
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"
# Los tests de la sesión ACP construyen un runtime mínimo.
tokio = { version = "1", features = ["rt", "macros"] }