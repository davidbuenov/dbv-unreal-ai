<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>DBV Unreal AI</title>
    <!-- Scripts clásicos en IIFE (NATIVE_DESKTOP_APPS.md §3); `main.js` carga con import() los módulos de app/, unreal/, generation/ y ai/ -->
    <script src="i18n.js" defer></script>
    <script src="main.js" defer></script>
  </head>

  <body>
    <div class="app">
      <header class="topbar">
        <h1>DBV Unreal AI</h1>
        <!-- Sin data-i18n: el texto depende de la conexión y lo pinta app.js (applyTranslations lo pisaría) -->
        <span id="unreal-pill" class="pill" role="status" aria-live="polite">Sin editor</span>
        <span class="spacer"></span>
        <span id="cost-pill" class="pill pill--cost hidden" data-i18n-title="gen.spentTitle" title="Créditos gastados en esta sesión"></span>
        <button id="btn-log" class="btn-icon" data-i18n-title="log.toggle" title="Registro de acciones">☰</button>
        <button id="btn-theme" class="btn-icon" data-i18n-title="app.theme" title="Tema claro/oscuro">◐</button>
        <label class="lang-picker" data-i18n-title="lang.label" title="Idioma">
          <select id="lang-select" aria-label="Idioma">
            <option value="es">ES</option>
            <option value="en">EN</option>
          </select>
        </label>
        <button id="btn-about" class="btn-icon" data-i18n-title="toolbar.about" title="Acerca de">ⓘ</button>
      </header>

      <nav class="sidebar" aria-label="Secciones">
        <button class="nav-item" data-view="project" aria-current="page"><span class="nav-icon">⌂</span><span data-i18n="nav.project">Proyecto</span></button>
        <button class="nav-item" data-view="chat"><span class="nav-icon">✦</span><span data-i18n="nav.chat">Conversación</span></button>
        <button class="nav-item" data-view="generate"><span class="nav-icon">◆</span><span data-i18n="nav.generate">Generar</span></button>
        <button class="nav-item" data-view="library"><span class="nav-icon">▦</span><span data-i18n="nav.library">Biblioteca</span></button>
        <span class="spacer"></span>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span><span data-i18n="nav.settings">Ajustes</span></button>
      </nav>

      <main class="main">
        <section id="view-project" class="view" data-view-panel="project"></section>
        <section id="view-chat" class="view view-chat hidden" data-view-panel="chat">
          <!-- El Asistente lo pinta `src/ai/` al cargarse, no antes -->
          <aside id="ai-panel-container" class="ai-sidebar"></aside>
        </section>
        <section id="view-generate" class="view hidden" data-view-panel="generate"></section>
        <section id="view-library" class="view hidden" data-view-panel="library"></section>
        <section id="view-settings" class="view hidden" data-view-panel="settings"></section>
        <aside id="action-log" class="action-log hidden" aria-label="Registro de acciones"></aside>
      </main>
    </div>

    <!-- Diff de la preparación, coste de una generación, mensajes -->
    <div id="app-modal" class="modal-overlay hidden">
      <div id="app-modal-card" class="modal-card" role="dialog" aria-modal="true"></div>
    </div>

    <div id="about-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <h3 data-i18n="about.title">Acerca de DBV Unreal AI</h3>
        <p id="about-version"></p>
        <p data-i18n="about.authors">David Bueno Vallejo y David Bueno Carmona · MIT</p>
        <p class="hint" data-i18n="about.builtWith">Construido con dbv-specs-ops.</p>
        <div class="modal-actions"><button id="about-close" data-i18n="about.close">Cerrar</button></div>
      </div>
    </div>

    <!-- «Conectar una IA»: el contenido lo pinta la IA al cargarse -->
    <div id="ai-connect-modal" class="modal-overlay hidden">
      <div id="ai-connect-backdrop" class="modal-backdrop"></div>
      <div id="ai-connect-card" class="modal-card ai-connect-card">
        <button id="ai-connect-close" class="btn-icon" data-i18n-title="action.close" title="Cerrar">✕</button>
        <h2 data-i18n="ai.connectTitle">Conectar una IA</h2>
        <div id="ai-connect-body" class="ai-form"></div>
      </div>
    </div>

    <!-- Confirmación (aviso de nube, coste, borrar) -->
    <div id="ai-confirm-modal" class="modal-overlay hidden">
      <div id="ai-confirm-backdrop" class="modal-backdrop"></div>
      <div id="ai-confirm-card" class="modal-card ai-confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="ai-confirm-title">
        <h2 id="ai-confirm-title"></h2>
        <p id="ai-confirm-text"></p>
        <div id="ai-confirm-actions" class="ai-confirm-card__actions"></div>
      </div>
    </div>
    <div id="editor-overlay" class="hidden"></div>
  </body>
</html>
